<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skycast</title>
  <meta name="description" content="A clean weather app powered by Google DeepMind's WeatherNext 3 ensemble forecasts.">
  <meta name="theme-color" content="#0f2742">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skycast">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sky" class="sky" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Saved places">
      <div class="sidebar-head">
        <span class="brand">Skycast</span>
      </div>
      <ul class="place-list" id="sidebarPlaces"></ul>
      <button class="ghost-btn add-place" data-action="open-search">+ Add place</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="place-btn" id="placeBtn" data-action="open-search" aria-label="Change location">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span id="placeName">Locating…</span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="topbar-actions">
          <button class="icon-btn" data-action="refresh" aria-label="Refresh" title="Refresh">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button class="icon-btn" data-action="open-settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7 7 0 0 0-.05-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.93 2h-3.86a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.71 8.47a.48.48 0 0 0 .12.61l2.03 1.58a7.3 7.3 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.86c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
          </button>
        </div>
      </header>

      <div id="banner" class="banner" hidden></div>

      <div id="content" class="content">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading forecast…</p>
        </div>
      </div>

      <footer class="footer" id="footer"></footer>
    </main>
  </div>

  <!-- Search sheet -->
  <div class="sheet-backdrop" id="searchSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
      <div class="sheet-head">
        <h2 id="searchTitle">Places</h2>
        <button class="icon-btn" data-action="close-sheet" aria-label="Close">✕</button>
      </div>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Search city or place" autocomplete="off" enterkeyhint="search">
      </div>
      <button class="list-row locate-row" data-action="use-location">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
        Use my current location
      </button>
      <ul class="result-list" id="searchResults"></ul>
      <h3 class="sheet-sub" id="savedTitle">Saved places</h3>
      <ul class="result-list" id="savedPlaces"></ul>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="settingsSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" data-action="close-sheet" aria-label="Close">✕</button>
      </div>
      <form id="settingsForm" class="settings">
        <fieldset>
          <legend>Data source</legend>
          <label class="radio"><input type="radio" name="source" value="weathernext"> <span><strong>WeatherNext 3</strong><small>Google DeepMind, 64-member ensemble. Needs an allowlisted Google account.</small></span></label>
          <label class="radio"><input type="radio" name="source" value="demo"> <span><strong>Demo</strong><small>Open-Meteo data, no sign-in. For trying the app.</small></span></label>
        </fieldset>

        <fieldset id="wnFields">
          <legend>WeatherNext access</legend>
          <label class="field">OAuth client ID
            <input name="clientId" type="text" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
          </label>
          <label class="field">Earth Engine Cloud project ID
            <input name="project" type="text" placeholder="my-weather-project" autocomplete="off" spellcheck="false">
          </label>
          <div class="auth-row">
            <span id="authStatus" class="muted">Not signed in</span>
            <button type="button" class="pill-btn" data-action="sign-in" id="signInBtn">Sign in with Google</button>
            <button type="button" class="ghost-btn" data-action="sign-out" id="signOutBtn">Sign out</button>
          </div>
          <p class="hint">Setup takes about 5 minutes. <a href="https://github.com/maxwernz/weathernext-app#setup" target="_blank" rel="noopener">Setup guide</a></p>
        </fieldset>

        <fieldset>
          <legend>Units</legend>
          <div class="seg" role="radiogroup" aria-label="Temperature">
            <label><input type="radio" name="temp" value="c"><span>°C</span></label>
            <label><input type="radio" name="temp" value="f"><span>°F</span></label>
          </div>
          <div class="seg" role="radiogroup" aria-label="Wind speed">
            <label><input type="radio" name="wind" value="kmh"><span>km/h</span></label>
            <label><input type="radio" name="wind" value="ms"><span>m/s</span></label>
            <label><input type="radio" name="wind" value="mph"><span>mph</span></label>
            <label><input type="radio" name="wind" value="kn"><span>kn</span></label>
          </div>
          <div class="seg" role="radiogroup" aria-label="Precipitation">
            <label><input type="radio" name="precip" value="mm"><span>mm</span></label>
            <label><input type="radio" name="precip" value="in"><span>in</span></label>
          </div>
        </fieldset>
      </form>
    </div>
  </div>


  <script type="module" src="js/app.js"></script>
</body>
</html>
